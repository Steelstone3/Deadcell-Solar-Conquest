[package]
name = "deadcell-solar-conquest-shared"
version = "0.6.1"
authors = ["Skippy <steelstone3@gmail.com>", "Demengies <Demengies@gmail.com>"]
edition = "2024"
homepage = "https://github.com/Steelstone3/Deadcell-Solar-Conquest"
repository = "https://github.com/Steelstone3/Deadcell-Solar-Conquest"
license = "GPLv3"
readme = "README.md"
include = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Fixed version dependencies
bevy = { version = "0.20", features = ["serialize"] }
# https://github.com/simgine/bevy_replicon_renet
bevy_replicon_renet = "0.21"
bevy_replicon = "0.45"

serde = { version = "1", features = ["derive"] }
rand = "0.8"

# Latest and greatest dependencies
rand_derive2 = "0"
